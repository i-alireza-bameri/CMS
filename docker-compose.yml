version: '3.8'

services:
  # Python FastAPI + SQLModel + Strawberry GraphQL Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnispace-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # --- Option 1: SQLite (Default) ---
      - DATABASE_URL=sqlite:////app/data/omnispace.db
      
      # --- Option 2: PostgreSQL (Uncomment below and postgres service) ---
      # - DATABASE_URL=postgresql+psycopg2://omnispace:omnispace_secret@postgres:5432/omnispace_db
      
      - JWT_SECRET=omnispace-production-jwt-secret-key-change-in-prod
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://127.0.0.1:3000
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    # depends_on:
    #   - postgres

  # Vite + React + Tailwind CSS Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: omnispace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Optional PostgreSQL Service (uncomment to switch from SQLite)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: omnispace-postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=omnispace
  #     - POSTGRES_PASSWORD=omnispace_secret
  #     - POSTGRES_DB=omnispace_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

volumes:
  backend-data:
  backend-uploads:
  # postgres-data:
